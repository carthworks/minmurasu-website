<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Theme request path compared with a Next.js request path">
  <rect width="1200" height="560" fill="#ffffff"/>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0082CA"/></marker>
  </defs>
  <g font-family="system-ui, Segoe UI, Arial, sans-serif" text-anchor="middle">
    <!-- Row 1: theme -->
    <text x="40" y="80" text-anchor="start" font-size="20" font-weight="800" fill="#475569">Theme-and-plugin site</text>
    <g font-size="17" font-weight="700">
      <rect x="40" y="110" width="150" height="80" rx="16" fill="#F0F8FF" stroke="#BAE6FD" stroke-width="2"/><text x="115" y="157" fill="#0D2040">Visitor</text>
      <rect x="250" y="110" width="150" height="80" rx="16" fill="#e2e8f0"/><text x="325" y="157" fill="#334155">PHP render</text>
      <rect x="460" y="110" width="150" height="80" rx="16" fill="#e2e8f0"/><text x="535" y="145" fill="#334155">30 plugins</text><text x="535" y="170" font-size="14" font-weight="400" fill="#64748b">hooks run</text>
      <rect x="670" y="110" width="150" height="80" rx="16" fill="#e2e8f0"/><text x="745" y="157" fill="#334155">Database</text>
      <rect x="880" y="110" width="280" height="80" rx="16" fill="#e2e8f0"/><text x="1020" y="145" fill="#334155">HTML + heavy JS</text><text x="1020" y="170" font-size="14" font-weight="400" fill="#64748b">then the browser does more work</text>
    </g>
    <g stroke="#94a3b8" stroke-width="3" marker-end="url(#g)">
      <line x1="192" y1="150" x2="246" y2="150"/><line x1="402" y1="150" x2="456" y2="150"/><line x1="612" y1="150" x2="666" y2="150"/><line x1="822" y1="150" x2="876" y2="150"/>
    </g>

    <line x1="40" y1="270" x2="1160" y2="270" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Row 2: next -->
    <text x="40" y="340" text-anchor="start" font-size="20" font-weight="800" fill="#0082CA">Next.js site</text>
    <g font-size="17" font-weight="700">
      <rect x="40" y="370" width="150" height="80" rx="16" fill="#F0F8FF" stroke="#BAE6FD" stroke-width="2"/><text x="115" y="417" fill="#0D2040">Visitor</text>
      <rect x="250" y="370" width="360" height="80" rx="16" fill="#0D2040"/><text x="430" y="405" fill="#fff">CDN edge</text><text x="430" y="430" font-size="14" font-weight="400" fill="#BAE6FD">pre-rendered HTML, optimised images</text>
      <rect x="670" y="370" width="490" height="80" rx="16" fill="#0082CA"/><text x="915" y="405" fill="#fff">Page ready</text><text x="915" y="430" font-size="14" font-weight="400" fill="#F0F8FF">minimal JavaScript; forms post to a validated API</text>
    </g>
    <g stroke="#0082CA" stroke-width="3" marker-end="url(#b)">
      <line x1="192" y1="410" x2="246" y2="410"/><line x1="612" y1="410" x2="666" y2="410"/>
    </g>
    <text x="600" y="510" font-size="15" fill="#64748b">Fewer steps per request and less JavaScript in the browser → better LCP and INP</text>
  </g>
</svg>
