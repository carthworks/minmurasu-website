<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="A map with clinic pins and a highlighted top-three local result">
  <defs>
    <pattern id="map" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="120" fill="#eef6fb"/>
      <path d="M0 60 H120 M60 0 V120" stroke="#ffffff" stroke-width="10"/>
      <path d="M0 20 H120 M20 0 V120 M0 100 H120 M100 0 V120" stroke="#ffffff" stroke-width="3"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#map)"/>
  <path d="M-20 470 C 200 400, 360 520, 600 430 S 1000 380, 1220 460" fill="none" stroke="#BAE6FD" stroke-width="34" stroke-linecap="round"/>
  <rect x="80" y="90" width="210" height="140" rx="16" fill="#d9f2e3"/>
  <rect x="860" y="470" width="260" height="120" rx="16" fill="#d9f2e3"/>

  <!-- pins -->
  <g>
    <g transform="translate(200 360)"><path d="M0 0 C -22 -30, -30 -44, -30 -58 A 30 30 0 1 1 30 -58 C 30 -44, 22 -30, 0 0 Z" fill="#94a3b8"/><circle cy="-58" r="11" fill="#fff"/></g>
    <g transform="translate(420 250)"><path d="M0 0 C -22 -30, -30 -44, -30 -58 A 30 30 0 1 1 30 -58 C 30 -44, 22 -30, 0 0 Z" fill="#94a3b8"/><circle cy="-58" r="11" fill="#fff"/></g>
    <g transform="translate(330 560)"><path d="M0 0 C -22 -30, -30 -44, -30 -58 A 30 30 0 1 1 30 -58 C 30 -44, 22 -30, 0 0 Z" fill="#94a3b8"/><circle cy="-58" r="11" fill="#fff"/></g>
    <g transform="translate(540 420) scale(1.5)"><path d="M0 0 C -22 -30, -30 -44, -30 -58 A 30 30 0 1 1 30 -58 C 30 -44, 22 -30, 0 0 Z" fill="#F58220"/><path d="M-9 -58 H9 M0 -67 V-49" stroke="#fff" stroke-width="5" stroke-linecap="round"/></g>
  </g>

  <!-- results card -->
  <g transform="translate(680 70)" font-family="system-ui, Segoe UI, Arial, sans-serif">
    <rect width="440" height="370" rx="24" fill="#ffffff" stroke="#BAE6FD" stroke-width="2"/>
    <rect x="24" y="22" width="392" height="44" rx="22" fill="#F0F8FF"/>
    <text x="48" y="51" font-size="17" fill="#475569">skin clinic near me</text>
    <g>
      <rect x="24" y="86" width="392" height="82" rx="16" fill="#fff7ed" stroke="#F58220" stroke-width="2"/>
      <text x="44" y="120" font-size="19" font-weight="800" fill="#0D2040">Your Clinic</text>
      <text x="44" y="148" font-size="16" fill="#F58220">★★★★★ <tspan fill="#475569">4.8 · Open now</tspan></text>
      <circle cx="380" cy="127" r="18" fill="#F58220"/><text x="380" y="134" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">1</text>
    </g>
    <g fill="#cbd5e1">
      <rect x="24" y="182" width="392" height="76" rx="16" fill="#f8fafc"/>
      <rect x="44" y="204" width="170" height="14" rx="7"/><rect x="44" y="228" width="120" height="12" rx="6"/>
      <circle cx="380" cy="220" r="16"/>
      <rect x="24" y="272" width="392" height="76" rx="16" fill="#f8fafc"/>
      <rect x="44" y="294" width="150" height="14" rx="7"/><rect x="44" y="318" width="110" height="12" rx="6"/>
      <circle cx="380" cy="310" r="16"/>
    </g>
  </g>
</svg>
