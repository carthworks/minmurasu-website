<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="A code editor feeding a funnel that ends in paying customers">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D2040"/>
      <stop offset="1" stop-color="#143a6e"/>
    </linearGradient>
    <linearGradient id="funnel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0082CA"/>
      <stop offset="1" stop-color="#F58220"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Code editor -->
  <g transform="translate(90 120)">
    <rect width="440" height="320" rx="18" fill="#0a1830" stroke="#2a4a7a" stroke-width="2"/>
    <rect width="440" height="40" rx="18" fill="#132a4f"/>
    <rect y="22" width="440" height="18" fill="#132a4f"/>
    <circle cx="26" cy="20" r="7" fill="#F58220"/>
    <circle cx="50" cy="20" r="7" fill="#f5c542"/>
    <circle cx="74" cy="20" r="7" fill="#3ccf91"/>
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17">
      <text x="28" y="82" fill="#7aa2d6">01</text><text x="70" y="82" fill="#BAE6FD">git push origin main</text>
      <text x="28" y="116" fill="#7aa2d6">02</text><text x="70" y="116" fill="#3ccf91">✓ deployed to production</text>
      <text x="28" y="150" fill="#7aa2d6">03</text><text x="70" y="150" fill="#ffffff" fill-opacity="0.85">signups_today = 0</text>
      <text x="28" y="184" fill="#7aa2d6">04</text><text x="70" y="184" fill="#F58220">// now what?</text>
      <text x="28" y="218" fill="#7aa2d6">05</text><rect x="70" y="203" width="190" height="18" rx="4" fill="#ffffff" fill-opacity="0.08"/>
      <text x="28" y="252" fill="#7aa2d6">06</text><rect x="70" y="237" width="250" height="18" rx="4" fill="#ffffff" fill-opacity="0.08"/>
      <text x="28" y="286" fill="#7aa2d6">07</text><rect x="70" y="271" width="140" height="18" rx="4" fill="#ffffff" fill-opacity="0.08"/>
    </g>
  </g>

  <!-- Flow arrow -->
  <path d="M548 280 C 610 280, 610 200, 668 200" fill="none" stroke="#BAE6FD" stroke-width="3" stroke-dasharray="8 8"/>
  <path d="M660 192 L672 200 L660 208" fill="none" stroke="#BAE6FD" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Funnel -->
  <g transform="translate(690 110)">
    <path d="M0 40 H400 L260 230 V320 H140 V230 Z" fill="url(#funnel)" opacity="0.92"/>
    <g font-family="system-ui, Segoe UI, Arial, sans-serif" font-weight="700" fill="#ffffff" text-anchor="middle">
      <text x="200" y="78" font-size="22">Position</text>
      <text x="200" y="128" font-size="22">Page</text>
      <text x="200" y="178" font-size="20">Measure</text>
      <text x="200" y="222" font-size="19">Channel</text>
    </g>
    <line x1="58" y1="95" x2="342" y2="95" stroke="#ffffff" stroke-opacity="0.25"/>
    <line x1="95" y1="145" x2="305" y2="145" stroke="#ffffff" stroke-opacity="0.25"/>
    <line x1="132" y1="195" x2="268" y2="195" stroke="#ffffff" stroke-opacity="0.25"/>
  </g>

  <!-- Paying customers -->
  <g transform="translate(830 460)">
    <rect x="-20" y="0" width="160" height="64" rx="32" fill="#ffffff"/>
    <text x="60" y="41" font-family="system-ui, Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#0D2040" text-anchor="middle">$ paid</text>
  </g>
  <circle cx="790" cy="492" r="14" fill="#3ccf91"/>
  <circle cx="1010" cy="492" r="14" fill="#3ccf91"/>
  <circle cx="1046" cy="470" r="9" fill="#3ccf91" opacity="0.7"/>
</svg>
