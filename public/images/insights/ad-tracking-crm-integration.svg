<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Ad clicks flowing into a CRM pipeline and conversion signals flowing back">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D2040"/>
      <stop offset="1" stop-color="#0b2b55"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g font-family="system-ui, Segoe UI, Arial, sans-serif">
    <!-- ad platforms -->
    <g transform="translate(110 150)">
      <rect width="220" height="120" rx="22" fill="#ffffff"/>
      <circle cx="54" cy="60" r="26" fill="#0082CA"/>
      <text x="54" y="69" text-anchor="middle" font-size="26" font-weight="900" fill="#fff">G</text>
      <text x="96" y="68" font-size="22" font-weight="800" fill="#0D2040">Ads</text>
    </g>
    <g transform="translate(110 360)">
      <rect width="220" height="120" rx="22" fill="#ffffff"/>
      <circle cx="54" cy="60" r="26" fill="#1d4ed8"/>
      <text x="54" y="69" text-anchor="middle" font-size="24" font-weight="900" fill="#fff">∞</text>
      <text x="96" y="68" font-size="22" font-weight="800" fill="#0D2040">Meta</text>
    </g>

    <!-- CRM pipeline -->
    <g transform="translate(700 130)">
      <rect width="400" height="370" rx="26" fill="#ffffff"/>
      <text x="30" y="52" font-size="20" font-weight="800" fill="#0082CA" letter-spacing="1">CRM PIPELINE</text>
      <g font-size="17" font-weight="700">
        <rect x="30" y="78" width="340" height="52" rx="12" fill="#F0F8FF"/><text x="50" y="110" fill="#0D2040">New enquiry</text><text x="350" y="110" text-anchor="end" fill="#64748b">42</text>
        <rect x="30" y="142" width="280" height="52" rx="12" fill="#dbeefe"/><text x="50" y="174" fill="#0D2040">Qualified</text><text x="290" y="174" text-anchor="end" fill="#64748b">17</text>
        <rect x="30" y="206" width="210" height="52" rx="12" fill="#BAE6FD"/><text x="50" y="238" fill="#0D2040">Meeting</text><text x="220" y="238" text-anchor="end" fill="#475569">9</text>
        <rect x="30" y="270" width="150" height="52" rx="12" fill="#F58220"/><text x="50" y="302" fill="#fff">Won ₹</text><text x="165" y="302" text-anchor="end" fill="#fff">4</text>
      </g>
    </g>

    <!-- forward flow -->
    <g stroke="#BAE6FD" stroke-width="4" fill="none">
      <path d="M335 210 C 520 210, 520 230, 695 230"/>
      <path d="M335 420 C 520 420, 520 250, 695 240"/>
    </g>
    <text x="515" y="190" text-anchor="middle" font-size="16" font-weight="700" fill="#BAE6FD">click ID + lead</text>

    <!-- return flow -->
    <g stroke="#F58220" stroke-width="4" fill="none" stroke-dasharray="10 8">
      <path d="M695 430 C 540 430, 520 300, 335 260"/>
      <path d="M695 450 C 540 450, 520 450, 335 450"/>
    </g>
    <text x="515" y="500" text-anchor="middle" font-size="16" font-weight="700" fill="#F58220">qualified + won, sent back</text>
  </g>
</svg>
