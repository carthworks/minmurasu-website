<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="Patient journey from search to review">
  <rect width="1200" height="520" fill="#ffffff"/>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0082CA"/></marker>
  </defs>
  <g font-family="system-ui, Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="60" font-size="26" font-weight="800" fill="#0D2040">The clinic patient journey</text>

    <g font-size="17" font-weight="800">
      <g><circle cx="110" cy="210" r="62" fill="#0D2040"/><text x="110" y="205" font-size="30">🔍</text><text x="110" y="238" font-size="15" fill="#fff">Search</text></g>
      <g><circle cx="275" cy="210" r="62" fill="#0D2040"/><text x="275" y="205" font-size="30">📍</text><text x="275" y="238" font-size="15" fill="#fff">Map top 3</text></g>
      <g><circle cx="440" cy="210" r="62" fill="#0082CA"/><text x="440" y="205" font-size="30">⭐</text><text x="440" y="238" font-size="15" fill="#fff">Profile</text></g>
      <g><circle cx="605" cy="210" r="62" fill="#0082CA"/><text x="605" y="205" font-size="30">📞</text><text x="605" y="238" font-size="15" fill="#fff">Call / WhatsApp</text></g>
      <g><circle cx="770" cy="210" r="62" fill="#0082CA"/><text x="770" y="205" font-size="30">📅</text><text x="770" y="238" font-size="15" fill="#fff">Booked</text></g>
      <g><circle cx="935" cy="210" r="62" fill="#F58220"/><text x="935" y="205" font-size="30">🏥</text><text x="935" y="238" font-size="15" fill="#fff">Visit</text></g>
      <g><circle cx="1100" cy="210" r="62" fill="#F58220"/><text x="1100" y="205" font-size="30">💬</text><text x="1100" y="238" font-size="15" fill="#fff">Review</text></g>
    </g>
    <g stroke="#0082CA" stroke-width="3" marker-end="url(#b)">
      <line x1="174" y1="210" x2="208" y2="210"/><line x1="339" y1="210" x2="373" y2="210"/><line x1="504" y1="210" x2="538" y2="210"/>
      <line x1="669" y1="210" x2="703" y2="210"/><line x1="834" y1="210" x2="868" y2="210"/><line x1="999" y1="210" x2="1033" y2="210"/>
    </g>

    <!-- brackets -->
    <path d="M60 310 V330 H325 V310" fill="none" stroke="#0D2040" stroke-width="2"/>
    <text x="192" y="362" font-size="16" font-weight="700" fill="#0D2040">Local SEO</text>
    <path d="M390 310 V330 H820 V310" fill="none" stroke="#0082CA" stroke-width="2"/>
    <text x="605" y="362" font-size="16" font-weight="700" fill="#0082CA">Profile, phone handling, booking</text>
    <path d="M885 310 V330 H1150 V310" fill="none" stroke="#F58220" stroke-width="2"/>
    <text x="1017" y="362" font-size="16" font-weight="700" fill="#F58220">Reminders + reviews</text>

    <path d="M1100 140 C 1100 70, 110 70, 110 140" fill="none" stroke="#F58220" stroke-width="2" stroke-dasharray="6 8"/>
    <text x="600" y="100" font-size="14" fill="#9a3412">new reviews strengthen future rankings</text>
    <text x="600" y="440" font-size="16" fill="#475569">Every arrow is a place patients drop off. Fix the leakiest step first.</text>
  </g>
</svg>
