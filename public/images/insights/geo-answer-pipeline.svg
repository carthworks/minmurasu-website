<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="Question, retrieve, rank, synthesise, cite">
  <rect width="1200" height="520" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#0082CA"/>
    </marker>
  </defs>
  <g font-family="system-ui, Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="60" font-size="26" font-weight="800" fill="#0D2040">How AI search turns a question into a cited answer</text>

    <g stroke="#0082CA" stroke-width="3" marker-end="url(#a)">
      <line x1="228" y1="250" x2="262" y2="250"/>
      <line x1="458" y1="250" x2="492" y2="250"/>
      <line x1="688" y1="250" x2="722" y2="250"/>
      <line x1="918" y1="250" x2="952" y2="250"/>
    </g>

    <g>
      <rect x="40" y="170" width="190" height="160" rx="20" fill="#F0F8FF" stroke="#BAE6FD" stroke-width="2"/>
      <text x="135" y="232" font-size="40">💬</text>
      <text x="135" y="276" font-size="21" font-weight="800" fill="#0D2040">Question</text>
      <text x="135" y="302" font-size="14" fill="#475569">“best CRM for clinics?”</text>
    </g>
    <g>
      <rect x="270" y="170" width="190" height="160" rx="20" fill="#0D2040"/>
      <text x="365" y="232" font-size="40">🔎</text>
      <text x="365" y="276" font-size="21" font-weight="800" fill="#fff">Retrieve</text>
      <text x="365" y="302" font-size="14" fill="#BAE6FD">from a search index</text>
    </g>
    <g>
      <rect x="500" y="170" width="190" height="160" rx="20" fill="#0D2040"/>
      <text x="595" y="232" font-size="40">⚖️</text>
      <text x="595" y="276" font-size="21" font-weight="800" fill="#fff">Rank</text>
      <text x="595" y="302" font-size="14" fill="#BAE6FD">relevance + trust</text>
    </g>
    <g>
      <rect x="730" y="170" width="190" height="160" rx="20" fill="#0D2040"/>
      <text x="825" y="232" font-size="40">✨</text>
      <text x="825" y="276" font-size="21" font-weight="800" fill="#fff">Synthesise</text>
      <text x="825" y="302" font-size="14" fill="#BAE6FD">write the answer</text>
    </g>
    <g>
      <rect x="960" y="170" width="200" height="160" rx="20" fill="#F58220"/>
      <text x="1060" y="232" font-size="40">🔗</text>
      <text x="1060" y="276" font-size="21" font-weight="800" fill="#fff">Cite</text>
      <text x="1060" y="302" font-size="14" fill="#fff7ed">link the sources used</text>
    </g>

    <g font-size="15" fill="#475569">
      <text x="365" y="380">Needs: crawlable, indexed,</text>
      <text x="365" y="402">fast pages</text>
      <text x="595" y="380">Needs: clear entity,</text>
      <text x="595" y="402">mentions on trusted sites</text>
      <text x="825" y="380">Needs: answer-first,</text>
      <text x="825" y="402">quotable passages</text>
    </g>
    <line x1="270" y1="440" x2="920" y2="440" stroke="#BAE6FD" stroke-width="2"/>
    <text x="595" y="474" font-size="16" font-weight="700" fill="#0082CA">What you can influence</text>
  </g>
</svg>
