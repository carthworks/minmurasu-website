<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Min Murasu — Animated Logo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;900&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#ffffff; --ink:#0F2341; --sub:#41506A; --chip:#F1F4F9; --line:#E2E7EF; }
  body.dark{ --bg:#0A1426; --ink:#F2F5FA; --sub:#A9B6CB; --chip:#14213A; --line:#22304A; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:"Lato",system-ui,sans-serif;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:32px 18px;transition:background .4s,color .4s}
  .stage{width:min(560px,92vw)}
  .stage svg{width:100%;height:auto;display:block;overflow:visible}
  .word{text-align:center;margin-top:6px}
  .word h1{font-weight:900;font-size:clamp(34px,7vw,58px);letter-spacing:.02em;line-height:1}
  .word .ta{font-size:clamp(15px,2.6vw,19px);color:var(--sub);margin-top:6px;letter-spacing:.04em}
  .word p{font-size:clamp(13px,2.2vw,16px);color:var(--sub);margin-top:8px}
  .word .bar{width:150px;height:3px;background:#F28A22;margin:14px auto 0;border-radius:2px;
    transform-origin:center;animation:bar var(--dur,2.4s) cubic-bezier(.45,0,.2,1) infinite}
  @keyframes bar{0%,44%{transform:scaleX(.55)}50%{transform:scaleX(1.08)}70%,100%{transform:scaleX(.55)}}
  .ctl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:34px}
  .ctl button{background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:20px;
    padding:7px 15px;font:inherit;font-size:13px;cursor:pointer}
  .ctl button.on{background:#F28A22;border-color:#F28A22;color:#fff}
  .note{font-size:12px;color:var(--sub);margin-top:12px;min-height:16px;text-align:center}
  body.paused *{animation-play-state:paused !important}
</style>
</head>
<body>

<div class="stage" id="stage">
<svg id="mark" viewBox="0 -30 420 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Min Murasu drum logo, animated">
  <style>
    .mm-stick{transform-origin:322px 6px;animation:mm-stick var(--dur,2.4s) infinite}
    @keyframes mm-stick{
      0%{transform:translate(16px,-26px) rotate(8deg);animation-timing-function:cubic-bezier(.45,0,.55,1)}
      34%{transform:translate(24px,-38px) rotate(12deg);animation-timing-function:cubic-bezier(.7,0,.95,.6)}
      46%{transform:translate(0,0) rotate(0deg);animation-timing-function:cubic-bezier(.2,.7,.4,1)}
      55%{transform:translate(8px,-13px) rotate(4deg);animation-timing-function:cubic-bezier(.5,0,.6,1)}
      62%{transform:translate(1px,-2px) rotate(.5deg);animation-timing-function:cubic-bezier(.45,0,.55,1)}
      100%{transform:translate(16px,-26px) rotate(8deg)}
    }
    .mm-drum{transform-box:fill-box;transform-origin:50% 85%;animation:mm-drum var(--dur,2.4s) infinite}
    @keyframes mm-drum{
      0%,45%{transform:scale(1,1)}
      49%{transform:scale(1.035,.955)}
      55%{transform:scale(.985,1.02)}
      62%{transform:scale(1.008,.995)}
      70%,100%{transform:scale(1,1)}
    }
    .mm-ripple{transform-box:fill-box;transform-origin:50% 50%;opacity:0;animation:mm-ripple var(--dur,2.4s) infinite}
    .mm-ripple.r2{animation-delay:calc(var(--dur,2.4s) * .06)}
    @keyframes mm-ripple{
      0%,45%{transform:scale(.15);opacity:0}
      47%{opacity:.85}
      75%{transform:scale(1);opacity:0}
      100%{transform:scale(1);opacity:0}
    }
    .mm-flash{transform-box:fill-box;transform-origin:50% 50%;opacity:0;animation:mm-flash var(--dur,2.4s) infinite}
    @keyframes mm-flash{0%,45%{opacity:0;transform:scale(.4)}48%{opacity:.9;transform:scale(1)}66%,100%{opacity:0;transform:scale(1.4)}}
    .mm-wave{transform-box:fill-box;transform-origin:0% 50%;animation:mm-wave var(--dur,2.4s) infinite}
    .mm-wave.w2{animation-delay:calc(var(--dur,2.4s) * .025)}
    .mm-wave.w3{animation-delay:calc(var(--dur,2.4s) * .05)}
    @keyframes mm-wave{
      0%,45%{opacity:.6;transform:translate(0,0) scaleX(.75)}
      50%{opacity:1;transform:translate(calc(var(--dx)*.4),calc(var(--dy)*.4)) scaleX(1.1)}
      68%{opacity:.9;transform:translate(var(--dx),var(--dy)) scaleX(1)}
      85%,100%{opacity:.6;transform:translate(0,0) scaleX(.75)}
    }
    .mm-px rect{animation:mm-px var(--dur,2.4s) infinite;transform-box:fill-box;transform-origin:50% 50%}
    @keyframes mm-px{
      0%,47%{opacity:1;transform:translateX(0) scale(1)}
      60%{opacity:.25;transform:translateX(-12px) scale(.75)}
      80%,100%{opacity:1;transform:translateX(0) scale(1)}
    }
    .mm-swoosh{transform-box:fill-box;transform-origin:60% 50%;animation:mm-swoosh var(--dur,2.4s) infinite}
    @keyframes mm-swoosh{0%,46%{transform:rotate(0) scale(1)}54%{transform:rotate(-2.5deg) scale(1.025)}72%,100%{transform:rotate(0) scale(1)}}
    .mm-shine{stroke-dasharray:60 520;animation:mm-shine var(--dur,2.4s) infinite linear}
    @keyframes mm-shine{0%,46%{stroke-dashoffset:60;opacity:0}50%{opacity:.9}80%{stroke-dashoffset:-430;opacity:0}100%{stroke-dashoffset:-430;opacity:0}}
    @media (prefers-reduced-motion:reduce){.mm-stick,.mm-drum,.mm-ripple,.mm-flash,.mm-wave,.mm-px rect,.mm-swoosh,.mm-shine{animation:none}}
  </style>
  <defs>
    <linearGradient id="mmBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2A3A5C"/><stop offset=".45" stop-color="#1B2A48"/><stop offset="1" stop-color="#101C33"/>
    </linearGradient>
    <linearGradient id="mmSwoosh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1D3F7A"/><stop offset=".55" stop-color="#1F6FC5"/><stop offset="1" stop-color="#2F93E6"/>
    </linearGradient>
    <radialGradient id="mmHead" cx=".45" cy=".4" r=".7">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E9EEF6"/>
    </radialGradient>
    <radialGradient id="mmGlow"><stop offset="0" stop-color="#FFB25E" stop-opacity=".95"/><stop offset="1" stop-color="#FFB25E" stop-opacity="0"/></radialGradient>
  </defs>

  <!-- digital pixels -->
  <g class="mm-px">
    <rect x="104" y="92"  width="15" height="15" rx="2" fill="#2F93E6" style="animation-delay:0s"/>
    <rect x="80"  y="112" width="12" height="12" rx="2" fill="#1F6FC5" style="animation-delay:.05s"/>
    <rect x="108" y="122" width="19" height="19" rx="2" fill="#1A5DAE" style="animation-delay:.02s"/>
    <rect x="56"  y="128" width="10" height="10" rx="2" fill="#2F93E6" style="animation-delay:.12s"/>
    <rect x="84"  y="140" width="15" height="15" rx="2" fill="#2F93E6" style="animation-delay:.08s"/>
    <rect x="36"  y="146" width="8"  height="8"  rx="1.5" fill="#1F6FC5" style="animation-delay:.18s"/>
    <rect x="62"  y="158" width="12" height="12" rx="2" fill="#1A5DAE" style="animation-delay:.14s"/>
    <rect x="96"  y="166" width="11" height="11" rx="2" fill="#1F6FC5" style="animation-delay:.1s"/>
    <rect x="44"  y="176" width="9"  height="9"  rx="1.5" fill="#2F93E6" style="animation-delay:.2s"/>
  </g>

  <!-- drum -->
  <g transform="translate(212 132) rotate(30)">
    <g class="mm-drum">
      <path d="M-76 -70 C -80 -8, -66 46, -50 76 A 50 18 0 0 0 50 76 C 66 46, 80 -8, 76 -70 Z"
            fill="url(#mmBody)" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
      <g fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round">
        <path d="M-53 -50 Q -58 22 -36 87"/>
        <path d="M-18 -43 Q -20 25 -12 92"/>
        <path d="M18 -43 Q 20 25 12 92"/>
        <path d="M53 -50 Q 58 22 36 87"/>
      </g>
      <ellipse cx="0" cy="-70" rx="76" ry="28" fill="url(#mmHead)" stroke="#F28A22" stroke-width="9"/>
      <ellipse class="mm-ripple"    cx="0" cy="-70" rx="60" ry="21" fill="none" stroke="#F28A22" stroke-width="3"/>
      <ellipse class="mm-ripple r2" cx="0" cy="-70" rx="44" ry="15" fill="none" stroke="#F7B26A" stroke-width="2.5"/>
      <ellipse class="mm-flash" cx="0" cy="-70" rx="30" ry="12" fill="url(#mmGlow)"/>
    </g>
  </g>

  <!-- swoosh ring -->
  <g class="mm-swoosh">
    <path d="M92 186 C 150 252, 280 246, 346 140 C 300 222, 170 244, 92 186 Z" fill="url(#mmSwoosh)"/>
    <path class="mm-shine" d="M102 193 C 165 240, 275 236, 338 150" fill="none" stroke="#BFE3FF" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- sound waves -->
  <g stroke="#F28A22" stroke-width="10" stroke-linecap="round" fill="none">
    <line class="mm-wave"    x1="306" y1="30"  x2="336" y2="13"  style="--dx:10px;--dy:-6px"/>
    <line class="mm-wave w2" x1="318" y1="66"  x2="356" y2="62"  style="--dx:12px;--dy:-1px"/>
    <line class="mm-wave w3" x1="310" y1="104" x2="342" y2="118" style="--dx:10px;--dy:5px"/>
  </g>

  <!-- stick -->
  <g class="mm-stick">
    <line x1="322" y1="6" x2="247" y2="74" stroke="#F28A22" stroke-width="10" stroke-linecap="round"/>
    <circle cx="245" cy="76" r="8.5" fill="#E2761A"/>
  </g>
</svg>
</div>

<div class="word">
  <h1>MIN MURASU</h1>
  <div class="ta">மின் முரசு</div>
  <p>Turn Digital Attention Into Business Growth</p>
  <div class="bar"></div>
</div>

<div class="ctl">
  <button id="pp">Pause</button>
  <button data-s="3.6">Slow</button>
  <button data-s="2.4" class="on">Normal</button>
  <button data-s="1.4">Fast</button>
  <button id="th">Dark background</button>
  <button id="cp">Copy SVG code</button>
</div>
<div class="note" id="note"></div>

<script>
  const root=document.documentElement, body=document.body, note=document.getElementById('note');
  const pp=document.getElementById('pp');
  pp.onclick=()=>{body.classList.toggle('paused');pp.textContent=body.classList.contains('paused')?'Play':'Pause';};
  document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('[data-s]').forEach(x=>x.classList.remove('on'));b.classList.add('on');
    root.style.setProperty('--dur',b.dataset.s+'s');
    // restart animations so all parts stay in sync
    const s=document.getElementById('mark'); const p=s.parentNode; const n=s.nextSibling; p.removeChild(s); void p.offsetWidth; p.insertBefore(s,n);
  });
  const th=document.getElementById('th');
  th.onclick=()=>{body.classList.toggle('dark');th.textContent=body.classList.contains('dark')?'Light background':'Dark background';};
  document.getElementById('cp').onclick=async()=>{
    const svg=document.getElementById('mark').outerHTML;
    try{await navigator.clipboard.writeText(svg);note.textContent='SVG copied — paste into a .svg file or straight into your website HTML.';}
    catch(e){note.textContent='Copy was blocked by the browser. Try again from the artifact’s own page.';}
  };
</script>
</body>
</html>
