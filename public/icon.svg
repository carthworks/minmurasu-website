<svg viewBox="0 0 380 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MIN MURASU Favicon">
  <defs>
    <linearGradient id="mmFavBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2A3A5C" />
      <stop offset=".45" stop-color="#1B2A48" />
      <stop offset="1" stop-color="#101C33" />
    </linearGradient>
    <linearGradient id="mmFavSwoosh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1D3F7A" />
      <stop offset=".55" stop-color="#1F6FC5" />
      <stop offset="1" stop-color="#2F93E6" />
    </linearGradient>
    <radialGradient id="mmFavHead" cx=".45" cy=".4" r=".7">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="1" stop-color="#E9EEF6" />
    </radialGradient>
    <radialGradient id="mmFavGlow">
      <stop offset="0" stop-color="#FFB25E" stop-opacity=".85" />
      <stop offset="1" stop-color="#FFB25E" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Crisp high-contrast rounded badge for light & dark browser tabs -->
  <rect x="6" y="6" width="368" height="368" rx="82" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="6" />

  <g transform="translate(-14, 66) scale(1.02)">
    <!-- Digital pixels -->
    <g>
      <rect x="104" y="92" width="16" height="16" rx="2.5" fill="#2F93E6" />
      <rect x="80" y="112" width="13" height="13" rx="2" fill="#1F6FC5" />
      <rect x="108" y="122" width="20" height="20" rx="2.5" fill="#1A5DAE" />
      <rect x="56" y="128" width="11" height="11" rx="2" fill="#2F93E6" />
      <rect x="84" y="140" width="16" height="16" rx="2.5" fill="#2F93E6" />
      <rect x="36" y="146" width="9" height="9" rx="1.5" fill="#1F6FC5" />
      <rect x="62" y="158" width="13" height="13" rx="2" fill="#1A5DAE" />
      <rect x="96" y="166" width="12" height="12" rx="2" fill="#1F6FC5" />
      <rect x="44" y="176" width="10" height="10" rx="1.5" fill="#2F93E6" />
    </g>

    <!-- Drum -->
    <g transform="translate(212 132) rotate(30)">
      <path
        d="M-76 -70 C -80 -8, -66 46, -50 76 A 50 18 0 0 0 50 76 C 66 46, 80 -8, 76 -70 Z"
        fill="url(#mmFavBody)"
        stroke="#FFFFFF"
        stroke-width="4"
        stroke-linejoin="round"
      />
      <g fill="none" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round">
        <path d="M-53 -50 Q -58 22 -36 87" />
        <path d="M-18 -43 Q -20 25 -12 92" />
        <path d="M18 -43 Q 20 25 12 92" />
        <path d="M53 -50 Q 58 22 36 87" />
      </g>
      <ellipse cx="0" cy="-70" rx="76" ry="28" fill="url(#mmFavHead)" stroke="#F28A22" stroke-width="10" />
      <ellipse cx="0" cy="-70" rx="52" ry="18" fill="none" stroke="#F7B26A" stroke-width="3" />
      <ellipse cx="0" cy="-70" rx="30" ry="12" fill="url(#mmFavGlow)" />
    </g>

    <!-- Swoosh ring -->
    <g>
      <path
        d="M92 186 C 150 252, 280 246, 346 140 C 300 222, 170 244, 92 186 Z"
        fill="url(#mmFavSwoosh)"
      />
      <path
        d="M102 193 C 165 240, 275 236, 338 150"
        fill="none"
        stroke="#BFE3FF"
        stroke-width="3.5"
        stroke-linecap="round"
      />
    </g>

    <!-- Sound waves -->
    <g stroke="#F28A22" stroke-width="11" stroke-linecap="round" fill="none">
      <line x1="306" y1="30" x2="336" y2="13" />
      <line x1="318" y1="66" x2="356" y2="62" />
      <line x1="310" y1="104" x2="342" y2="118" />
    </g>

    <!-- Left stick -->
    <g>
      <line x1="120" y1="-5" x2="212" y2="58" stroke="#F28A22" stroke-width="11" stroke-linecap="round" />
      <circle cx="214" cy="59" r="9.5" fill="#E2761A" />
    </g>

    <!-- Right stick -->
    <g>
      <line x1="322" y1="6" x2="247" y2="74" stroke="#F28A22" stroke-width="11" stroke-linecap="round" />
      <circle cx="245" cy="76" r="9.5" fill="#E2761A" />
    </g>
  </g>
</svg>

